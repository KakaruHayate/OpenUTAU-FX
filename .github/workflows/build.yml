name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: OpenUtauFX-windows-x64
          - name: macOS
            os: macos-latest
            artifact: OpenUtauFX-macos

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Fetch the VST3 SDK
        shell: bash
        run: |
          cd iPlug2/Dependencies/IPlug
          if [ ! -d VST3_SDK/pluginterfaces ]; then
            bash download-vst3-sdk.sh
          fi

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build -A x64 -DIPLUG2_DIR="${{ github.workspace }}/iPlug2"
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DIPLUG2_DIR="${{ github.workspace }}/iPlug2"
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Show build output
        shell: bash
        run: find build -maxdepth 3 \( -name '*.vst3' -o -name '*.app' -o -name 'OpenUtauFX.exe' \) -print

      - name: Upload plug-ins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            build/out/**
            build/**/out/**
